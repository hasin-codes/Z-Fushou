appId: com.zfushou.desktop
productName: ZFushou
executableName: ZFushou
artifactName: ZFushou-${version}-${arch}.${ext}
asar: true
asarUnpack:
  - "**/*.node"
  - ".next/standalone/**/*"
  - ".next/static/**/*"
  - "build/icon.png"
  - "build/icon.ico"
protocols:
  name: ZFushou
  schemes:
    - z-fushou
directories:
  output: release
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - build/icon.ico
  - build/icon.png
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**
mac:
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  signAndEditExecutable: true
  signExts: null
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  provider: github
